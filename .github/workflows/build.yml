name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Check www/index.html for errors
        run: |
          node test/check-syntax.js
          node test/reminders.test.js

      - name: Install Capacitor dependencies
        run: npm install

      - name: Stamp build version
        run: |
          STAMP="v$(date -u +%Y-%m-%d)-$(git rev-parse --short HEAD)"
          sed -i "s/v0\.0\.0-dev/$STAMP/" www/index.html

      - name: Add Android platform (first run only)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      # Every GitHub build machine is brand new, so without this Gradle invents a
      # new random signing key each time and Android refuses to update the app.
      # The key lives in the repo secret DEBUG_KEYSTORE_BASE64 (never in the code).
      - name: Use the same signing key every build
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Repo secret DEBUG_KEYSTORE_BASE64 is missing. See README > Signing key."
            exit 1
          fi
          KEYDIR="${ANDROID_USER_HOME:-$HOME/.android}"
          mkdir -p "$KEYDIR"
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KEYDIR/debug.keystore"
          # Fingerprint is public info; it must be identical in every build log.
          keytool -list -v -keystore "$KEYDIR/debug.keystore" -storepass android | grep SHA256:

      - name: Sync www/ into the Android project
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ink-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
